[workspace]
resolver = "3"
members = ["crates/perldantic-core", "ffi"]
# The verbatim upstream snapshot is reference material, never built.
exclude = ["upstream"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ice1x/perldantic"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
