[workspace]
resolver = "3"
members = ["crates/perldantic-core", "ffi"]
# The verbatim upstream snapshot is reference material, never built.
exclude = ["upstream"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ice1x/perldantic"

[workspace.lints.clippy]
# Mirrors upstream pydantic-core's lint policy (pedantic, with the same allow-list), so ported
# code needs no lint rewrites.
dbg_macro = "warn"
print_stdout = "warn"
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
float_cmp = "allow"
fn_params_excessive_bools = "allow"
if_not_else = "allow"
match_bool = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
