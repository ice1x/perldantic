[package]
name = "perldantic-core"
description = "Python-free port of the pydantic-core validation engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
enum_dispatch = "0.3.13"
hex = "0.4.3"
jiter = "0.16.0"
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2.19"
regex = "1.12.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision"] }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
num-bigint = "0.4.6"
base64 = "0.22.1"
serde = { version = "1.0.219", features = ["derive"] }
# preserve_order: conformance inputs are dicts whose key order matters, as in Python.
serde_json = { version = "1.0.149", features = ["preserve_order"] }

[lints]
workspace = true
