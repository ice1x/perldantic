[package]
name = "perldantic-ffi"
description = "C ABI over perldantic-core, consumed by the Perldantic Perl distribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "perldantic_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
num-bigint = "0.4.6"
perldantic-core = { path = "../crates/perldantic-core" }
serde_json = "1.0.149"

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }

[lints]
workspace = true
