# C header of the perldantic-ffi ABI; tests/header.rs regenerates it and fails when the committed
# ffi/include/perldantic.h is stale (set PERLDANTIC_UPDATE_HEADER=1 to rewrite it).
language = "C"
header = "/* Generated by cbindgen from ffi/src/lib.rs; do not edit. */"
include_guard = "PERLDANTIC_H"
documentation = true
documentation_style = "c99"
style = "type"
cpp_compat = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
